name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  minimum-swift:
    name: Minimum supported Swift (6.3.3)
    runs-on: ubuntu-latest
    container: swift:6.3.3-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Require Swift 6.3.3
        run: |
          swift --version
          swift --version | grep -F "Swift version 6.3.3"
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  current-swift:
    name: Swift 6.4 (Xcode 27, default traits)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Require Swift 6.4
        run: |
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          [[ "$swift_version" == *"Swift version 6.4"* ]]
      - name: Build
        run: swift build
      - name: Build iOS Simulator target (iOS 15+)
        run: swift build --target SwiftJev --triple arm64-apple-ios15.0-simulator
      - name: Run tests
        run: swift test
